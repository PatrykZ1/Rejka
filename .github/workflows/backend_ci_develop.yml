name: Rejka Backend CI - dev

on:
  push:
    branches: ["dev"]

  pull_request:
    branches: ["dev"]

jobs:
  backend-ci-dev:
    name: Rejka backend CI - dev
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build backend.sln --configuration Release

      - name: Run tests
        run: dotnet test backend.sln --configuration Release --no-build --no-restore
